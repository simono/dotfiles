- name: "{{ component }} | create config dir"
  ansible.builtin.file:
    path: "~/.config/fish/{{ item }}"
    state: directory
  loop: [conf.d]

- name: "{{ component }} | link config"
  ansible.builtin.file:
    src: "{{ item }}"
    dest: "~/.config/fish/{{ item | relpath(playbook_dir + '/fish') }}"
    state: link
  loop: >-
    {{ query('fileglob', playbook_dir + '/fish/conf.d/*')
     + [playbook_dir + '/fish/fish_plugins'] }}

- name: "{{ component }} | update fisher"
  ansible.builtin.command: fish -c 'fisher update'
  changed_when: false

# Make sure fisher installed every plugin and didn't fail silently.
- name: "{{ component }} | check fisher installed every plugin"
  ansible.builtin.command: >-
    fish -c 'diff (fisher list | sort | psub)
    (string lower < $__fish_config_dir/fish_plugins | sort | psub)'
  changed_when: false
